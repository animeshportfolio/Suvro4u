<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suvro Mahat | Cinematic Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#050505;
color:white;
font-family:'Poppins',sans-serif;
overflow-x:hidden;
}

/* Cursor Glow */
.cursor{
width:20px;
height:20px;
border:2px solid #a855f7;
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
transition:0.1s;
box-shadow:0 0 20px #a855f7;
}

/* Loader */
#loader{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.loader-text{
font-family:'Orbitron';
font-size:28px;
color:#a855f7;
letter-spacing:5px;
animation:pulse 1s infinite;
}
@keyframes pulse{
0%,100%{opacity:1}
50%{opacity:0.3}
}

/* Hero */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle at center,#0f0f0f,#000);
}
.hero h1{
font-size:50px;
font-family:'Orbitron';
background:linear-gradient(90deg,#a855f7,#9333ea);
-webkit-background-clip:text;
color:transparent;
animation:fadeIn 2s ease;
}
.hero p{
color:#aaa;
margin:20px 0;
}
.btn{
padding:12px 30px;
border:none;
background:#a855f7;
border-radius:30px;
color:white;
cursor:pointer;
transition:0.3s;
}
.btn:hover{
transform:scale(1.1);
box-shadow:0 0 25px #a855f7;
}

/* Sections */
.section{
padding:80px 20px;
text-align:center;
}
.section h2{
margin-bottom:40px;
font-size:28px;
}

/* Grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* Cards */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
transition:0.4s;
position:relative;
overflow:hidden;
}
.card::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,#a855f7,transparent);
top:-100%;
left:0;
transition:0.5s;
}
.card:hover::before{
top:100%;
}
.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 25px #a855f7;
}

/* Video popup */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:999;
}
.modal video{
width:80%;
border-radius:10px;
}

/* WhatsApp */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
font-size:22px;
color:white;
text-decoration:none;
box-shadow:0 0 20px #25D366;
}

/* Footer */
footer{
text-align:center;
padding:20px;
background:#000;
color:#777;
}

/* Animation */
@keyframes fadeIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="cursor"></div>

<!-- Loader -->
<div id="loader">
<div class="loader-text">SUVRO EDITS</div>
</div>

<!-- Hero -->
<section class="hero">
<h1>Suvro Mahat</h1>
<p>Where Cinema Meets Viral Creativity</p>
<button class="btn" onclick="scrollToPortfolio()">Watch Edits</button>
</section>

<!-- Portfolio -->
<section class="section" id="portfolio">
<h2>My Cinematic Edits</h2>
<div class="grid">

<div class="card" onclick="openVideo()">
🎬 Edit Sample 1
</div>

<div class="card" onclick="openVideo()">
🎬 Edit Sample 2
</div>

<div class="card" onclick="openVideo()">
🎬 Edit Sample 3
</div>

</div>
</section>

<!-- Services -->
<section class="section">
<h2>Services</h2>
<div class="grid">
<div class="card">Movie Clip Editing</div>
<div class="card">Viral Reel Editing</div>
<div class="card">Cinematic Effects</div>
</div>
</section>

<!-- Download -->
<section class="section">
<h2>Download Sample</h2>
<a class="btn" href="#">Download Demo Edit</a>
</section>

<!-- Contact -->
<section class="section">
<h2>Contact Me</h2>
<a class="btn" href="https://www.instagram.com/suvro4u.aep" target="_blank">Instagram</a>
</section>

<!-- Video Modal -->
<div class="modal" id="videoModal" onclick="closeVideo()">
<video controls autoplay>
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>
</div>

<!-- WhatsApp -->
<a class="whatsapp" href="https://wa.me/919635682399" target="_blank">💬</a>

<footer>
© 2026 Suvro Mahat | Cinematic Editor
</footer>

<script>

// Loader
window.onload=()=>{
setTimeout(()=>{document.getElementById("loader").style.display="none"},1500)
}

// Scroll
function scrollToPortfolio(){
document.getElementById("portfolio").scrollIntoView({behavior:'smooth'})
}

// Cursor
const cursor=document.querySelector(".cursor")
document.addEventListener("mousemove",(e)=>{
cursor.style.top=e.clientY+"px"
cursor.style.left=e.clientX+"px"
})

// Video Modal
function openVideo(){
document.getElementById("videoModal").style.display="flex"
}
function closeVideo(){
document.getElementById("videoModal").style.display="none"
}

</script>

</body>
</html>
